name: Test build docs

on:
  pull_request:
    branches: [main]

jobs:
  test-build:
    name: Test build docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: 'package.json'

      - name: Setup Yarn
        uses: yarnpkg/setup-action@c9778d0717d1b46cf29f06ae5ae5ad41c1bb1c1a

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          activate-environment: true

      - name: Install dependencies
        run: yarn install --immutable

      - name: Install docs dependencies
        run: yarn install-docs-deps

      - name: Clean docs directories
        run: rm -rf site docs/api

      - name: Build docs
        run: yarn build-docs
